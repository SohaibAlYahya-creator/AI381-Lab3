name: deploy-azure

on:
  workflow_run:
    workflows: [train-and-gate]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: ai381-lab3-rg
  APP_NAME: ai381-churn-api
  ENVIRONMENT: ai381-lab3-env

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Image name from the commit
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${SHA::7}" >> "$GITHUB_ENV"
      - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/container-apps-deploy-action@8dff69dac3367c32ceb2690d8f13adbeab462703 # v2
        with:
          imageToDeploy: ${{ env.IMAGE }}
          containerAppName: ${{ env.APP_NAME }}
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.ENVIRONMENT }}
          targetPort: 8000
          ingress: external
      - name: Scale to zero when idle (and cap the cost)
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update -n "$APP_NAME" -g "$RESOURCE_GROUP" --min-replicas 0 --max-replicas 2
      - name: Smoke test on the public URL
        run: |
          FQDN=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query properties.configuration.ingress.fqdn -o tsv)
          bash scripts/smoke_test.sh "https://$FQDN"
          {
            echo "### Deployed"
            echo "| | |"; echo "|---|---|"
            echo "| Public URL | https://$FQDN |"
            echo "| Image tag | \`$IMAGE\` |"
            echo "| Commit SHA | \`$SHA\` |"
            echo "| /health | \`$(cat /tmp/health.json)\` |"
          } >> "$GITHUB_STEP_SUMMARY"
